{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — THOT</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-bg">

  <div class="card glass-card text-white p-4 p-md-5" style="width: 100%; max-width: 440px;">
    <div class="text-center mb-4">
      <div class="brand-logo-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">T</div>
      <h3 class="fw-bold m-0">Sistema THOT</h3>
      <p class="text-white-50 small mt-1">Plataforma de Gestión Estudiantil</p>
    </div>

    <!-- Mensajes de Alerta Django -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger alert-dismissible fade show text-white bg-danger bg-opacity-25 border-danger small mb-4" role="alert">
          <i class="bi bi-exclamation-circle-fill me-2"></i> {{ message }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label text-white fw-medium">
          <i class="bi bi-person-fill me-1"></i> Usuario
        </label>
        {{ form.username }}
      </div>

      <div class="mb-4">
        <label for="{{ form.password.id_for_label }}" class="form-label text-white fw-medium">
          <i class="bi bi-lock-fill me-1"></i> Contraseña
        </label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn btn-thot-primary w-100 py-3 fs-6">
        <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'password_reset' %}" class="text-white-50 small text-decoration-none">
        <i class="bi bi-key-fill me-1"></i> ¿Olvidó su contraseña?
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
