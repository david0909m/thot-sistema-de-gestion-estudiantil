{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instrucciones Enviadas — THOT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-bg">

  <div class="card glass-card text-white p-4 p-md-5" style="width: 100%; max-width: 440px;">
    <div class="text-center mb-4">
      <div class="brand-logo-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">T</div>
      <h3 class="fw-bold m-0">Instrucciones Enviadas</h3>
      <p class="text-white-50 small mt-3">
        <i class="bi bi-envelope-check-fill me-1"></i>
        Si existe una cuenta con ese correo, recibirá un mensaje con los pasos para restablecer su contraseña.
      </p>
      <p class="text-white-50 small">Revise su bandeja de entrada y la carpeta de spam.</p>
    </div>

    <div class="text-center">
      <a href="{% url 'login' %}" class="btn btn-thot-primary w-100 py-3 fs-6 text-decoration-none">
        <i class="bi bi-box-arrow-in-right me-2"></i> Volver a iniciar sesión
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
